steps:
  # 1. Install dependencies
  - name: "node:20-alpine"
    entrypoint: npm
    args: ["ci", "--prefer-offline"]

  # 2. Generate Prisma client
  - name: "node:20-alpine"
    entrypoint: npm
    args: ["run", "db:generate"]

  # 3. Run lint
  - name: "node:20-alpine"
    entrypoint: npm
    args: ["run", "lint"]

  # 4. Run unit tests
  - name: "node:20-alpine"
    entrypoint: npm
    args: ["run", "test", "--", "--run"]

  # 5. Build the Next.js app
  - name: "node:20-alpine"
    entrypoint: npm
    args: ["run", "build"]
    env:
      - "NEXT_TELEMETRY_DISABLED=1"

  # 6. Build container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--tag"
      - "gcr.io/$PROJECT_ID/nobroker-crm:$COMMIT_SHA"
      - "--tag"
      - "gcr.io/$PROJECT_ID/nobroker-crm:latest"
      - "."

  # 7. Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/nobroker-crm:$COMMIT_SHA"]

  # 8. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "nobroker-crm"
      - "--image=gcr.io/$PROJECT_ID/nobroker-crm:$COMMIT_SHA"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated=false"
      - "--set-env-vars=TZ=Asia/Kolkata,NEXTAUTH_URL=https://crm.nobroker.in,ALLOWED_DOMAIN=nobroker.in"
      - "--set-secrets=DATABASE_URL=crm-db-url:latest,NEXTAUTH_SECRET=crm-nextauth-secret:latest,GOOGLE_CLIENT_ID=crm-google-client-id:latest,GOOGLE_CLIENT_SECRET=crm-google-client-secret:latest,GOOGLE_SERVICE_ACCOUNT_KEY=crm-service-account:latest"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--memory=512Mi"
      - "--cpu=1"
      - "--timeout=60s"
      - "--concurrency=80"
      - "--add-cloudsql-instances=$PROJECT_ID:asia-south1:nobroker-crm-db"

images:
  - "gcr.io/$PROJECT_ID/nobroker-crm:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/nobroker-crm:latest"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
